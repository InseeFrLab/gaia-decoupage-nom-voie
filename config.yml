# Configuration du découpage de libellés de voies
# Modifier ce fichier avant de lancer le traitement.

# Plateforme d'exécution : "ls3", "datalab" ou "local"
platform: ls3

input:
  # Dossier contenant le fichier à traiter
  # - Sur LS3/Datalab : chemin S3 sans slash final, ex: "projet-gaia/decoupage"
  # - En local        : chemin relatif ou absolu,   ex: "data"
  directory: travail/projet-ml-moteur-identification-gaia/confidentiel/personnel_non_sensible

  # Nom du fichier à traiter (csv, parquet, ou dossier parquet)
  filename: test_decoupage_majic.csv

  # Séparateur CSV (ignoré si parquet)
  sep: ","

  # Encodage CSV (ignoré si parquet)
  encoding: utf-8

output:
  # Format de sortie : "csv" ou "parquet"
  format: csv

# Colonne(s) contenant le libellé de voie à découper.
# - Une seule colonne  : - nom_voie_complet
# - Plusieurs à concat : - id_type_voie 
#                        - nom_voie_norm
voie_columns:
  - dvoilib

# Taille des chunks traités en parallèle
chunk_size: 10000

# Nombre de threads parallèles
# Recommandé : 20 sur Datalab/LS3, 4 en local
num_threads: 4
